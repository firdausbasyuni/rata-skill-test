services:
  postgres:
    image: postgres:16-alpine
    container_name: healthcare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-migrate:
    build:
      context: ./auth-service
      target: builder
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/auth_db?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  schedule-migrate:
    build:
      context: ./schedule-service
      target: builder
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/schedule_db?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  auth-service:
    build:
      context: ./auth-service
      target: runner
    container_name: healthcare-auth-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/auth_db?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
    ports:
      - "3001:3001"
    depends_on:
      auth-migrate:
        condition: service_completed_successfully

  schedule-service:
    build:
      context: ./schedule-service
      target: runner
    container_name: healthcare-schedule-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/schedule_db?schema=public
      AUTH_SERVICE_URL: http://auth-service:3001/graphql
    ports:
      - "3002:3002"
    depends_on:
      schedule-migrate:
        condition: service_completed_successfully
      auth-service:
        condition: service_started

volumes:
  postgres_data:
